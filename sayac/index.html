<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Yabbie WampServer Slot Counter</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Sadece Görsel İkon Alanı -->
    <div class="logo-container">
        <img src="yabbie.png" alt="Yabbie" class="yabbie-img">
    </div>
    
    <!-- 3 Bölmeli Mekanik Kutu Alanı -->
    <div class="counter-container">
        <div class="digit-window">
            <div id="strip1" class="digit-strip"></div>
        </div>
        <div class="digit-window">
            <div id="strip2" class="digit-strip"></div>
        </div>
        <div class="digit-window">
            <div id="strip3" class="digit-strip"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
